<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>title</title>
  <style>
    body {
      background-color: black;
    }

    * {
      cursor: none;
    }

    .cursor {
      z-index: 200;
      border: 1px solid #F3F2F130;
      border-radius: 50%;
      width: 3em;
      height: 3em;
      transition: background-color .375s cubic-bezier(.625, .05, 0, 1), height .375s cubic-bezier(.625, .05, 0, 1), width .375s cubic-bezier(.625, .05, 0, 1), opacity .375s cubic-bezier(.625, .05, 0, 1), border-color .375s cubic-bezier(.625, .05, 0, 1);
      position: fixed;
      inset: 0% auto auto 0%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursor,
    .cursor__inner {
      mix-blend-mode: difference !important;
    }

    .cursor__inner {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      width: 10px;
      height: 10px;
      inset: 0% auto auto 0%;
    }

    .cursor__dot {
      width: 7px;
      height: 7px;
      margin-left: 1px;
      margin-top: 1px;
      border: 1px solid #F3F2F1;
      border-radius: 50%;
      transition: opacity .3s linear;
      position: absolute;
      opacity: 1;
    }

    .cursor__anim {
      width: 9px;
      height: 9px;
      opacity: 0;
      position: absolute;
      inset: 0% auto auto 0%;
      transition: opacity .3s linear;
    }

    .cursor--text {
      position: absolute;
      color: #F3F2F1;
      /* inset: 0% auto auto 0%; */
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s linear;
    }

    /* ADD 1 LINE */
    .cursor__open,
    .cursor__read, 
    .cursor__drag,
    .cursor__click {
      transform: translateX(-33%) translateY(-4px);
    }

    .cursor__next, .cursor__prev {
      transform: translateX(-3px) translateY(-6px)
    }

    .cursor__glow--blue {
      pointer-events: none;
      width: 200px;
      height: 200px;
      margin-left: -100px;
      margin-top: -100px;
      background: radial-gradient(50% 50% at 50% 50%, rgba(91, 126, 207, 0.70) 0%, rgba(91, 126, 207, 0.00) 100%);
      border-radius: 50%;
      position: absolute;
      opacity: 0;
      transition: opacity .5s linear;
      filter: blur(10px);
      position: fixed;
      left: 0;
      top: 0;
    }

    .cursor__glow--pink {
      width: 160px;
      height: 160px;
      margin-left: -75px;
      margin-top: -75px;
      background: radial-gradient(50% 50% at 50% 50%, #EAAEAE 0%, rgba(234, 174, 174, 0.00) 100%);
      border-radius: 50%;
      position: absolute;
      opacity: 0;
      transition: opacity .5s linear;
    }

    .cursor__inner.cursor__inner--moving .cursor__anim {
      opacity: 1;
    }

    .cursor__inner.cursor__inner--moving .cursor__dot {
      opacity: 0;
    }

    body:has(a:hover) .cursor,
    body:has(button:hover) .cursor,
    body:has([data-cursor]:hover) .cursor {
      border: 1px solid #F3F2F130;
      background-color: transparent;
      width: 1.25em;
      height: 1.25em;
      border-color: #EAAEAE50;
    }

    body:has(a:hover) .cursor__dot,
    body:has(button:hover) .cursor__dot,
    body:has([data-cursor]:hover) .cursor__dot {
      background-color: #EAAEAE;
      border: 0px solid #F3F2F100;
      margin: 0;
      width: 10px;
      height: 10px;
      opacity: 1 !important;
    }

    body:has(a:hover) .cursor__anim,
    body:has(button:hover) .cursor__anim,
    body:has([data-cursor]:hover) .cursor__anim {
      opacity: 0 !important;
    }

    .glow--pink:hover .cursor,
    .glow--blue:hover .cursor {
      opacity: 0;
    }


    .glow--blue:hover .cursor__glow--blue,
    .glow--pink:hover .cursor__glow--pink {
      opacity: 0.3;
    }

    body:has(.glow--pink:hover) .cursor__inner,
    body:has(.glow--blue:hover) .cursor__inner {
      mix-blend-mode: lighten !important;
    }

    /* ADD 1 LINE */
    body:has(.cursor--open:hover) .cursor__inner,
    body:has(.cursor--drag:hover) .cursor__inner,
    body:has(.cursor--click:hover) .cursor__inner,
    body:has(.cursor--read:hover) .cursor__inner,
    body:has(.cursor--next:hover) .cursor__inner,
    body:has(.cursor--prev:hover) .cursor__inner {
      mix-blend-mode: normal !important;
    }

    /* ADD 1 LINE */
    body:has(.cursor--open:hover) .cursor,
    body:has(.cursor--drag:hover) .cursor,
    body:has(.cursor--click:hover) .cursor,
    body:has(.cursor--read:hover) .cursor,
    body:has(.cursor--next:hover) .cursor,
    body:has(.cursor--prev:hover) .cursor {
      mix-blend-mode: normal !important;
    }

     body:has(.glow--pink:hover) .cursor__dot,
      body:has(.glow--blue:hover) .cursor__dot {
          background-color: #F3F2F1;
         }

    /* ADD 1 LINE */
    body:has(.cursor--open:hover) .cursor__open,
    body:has(.cursor--drag:hover) .cursor__drag,
    body:has(.cursor--click:hover) .cursor__click,
    body:has(.cursor--read:hover) .cursor__read,
    body:has(.cursor--next:hover) .cursor__next,
    body:has(.cursor--prev:hover) .cursor__prev {
      opacity: 1;
    }

    /* ADD 1 LINE */
    body:has(.cursor--open:hover) .cursor,
    body:has(.cursor--drag:hover) .cursor,
    body:has(.cursor--click:hover) .cursor,
    body:has(.cursor--read:hover) .cursor,
    body:has(.cursor--next:hover) .cursor,
    body:has(.cursor--prev:hover) .cursor {
      /* opacity: 0; */
      width: 4.5em;
      background:  radial-gradient(54.97% 54.85% at 50% 50%, rgba(243, 242, 241, 0.06) 0%, rgba(243, 242, 241, 0.00) 100%);
      /* background: linear-gradient(90deg, rgba(243, 242, 241, 0.00) 0%, rgba(243, 242, 241, 0.04) 50.5%, rgba(243, 242, 241, 0.00) 100%); */
      height: 3.4em;
      border-radius: 1.8rem;
      border-width: 0px 1px 0px 1px;
      /* border-color: #F3F2F1; */
      /* backdrop-filter: blur(20px); */
      /* border-color: transparent #F3F2F130 transparent #F3F2F130; */
      /* height: 3em; */
    }


    /* ADD 2 LINES */
    body:has(.cursor--open:hover) .cursor__dot,
    body:has(.cursor--open:hover) .cursor__anim,
    body:has(.cursor--drag:hover) .cursor__dot,
    body:has(.cursor--drag:hover) .cursor__anim,
    body:has(.cursor--read:hover) .cursor__dot,
    body:has(.cursor--read:hover) .cursor__anim,
    body:has(.cursor--click:hover) .cursor__dot,
    body:has(.cursor--click:hover) .cursor__anim,
    body:has(.cursor--next:hover) .cursor__dot,
    body:has(.cursor--next:hover) .cursor__anim,
    body:has(.cursor--prev:hover) .cursor__dot,
    body:has(.cursor--prev:hover) .cursor__anim,
    body:has(.cursor--read:hover) .cursor__drag {
      opacity: 0 !important;
    }

    body:has(.cursor--drag:hover):has(button:hover) .cursor__drag {
      opacity: 0 !important;
    }
    body:has(.cursor--drag:hover):has(button:hover) .cursor {
      border: 1px solid #F3F2F130;
      background-color: transparent;
      width: 1.25em;
      height: 1.25em;
      border-color: #EAAEAE50;
    }

    body:has(.cursor--drag:hover):has(button:hover) .cursor__dot {
      opacity: 1 !important;
    }



    @media (hover: none) and (pointer: coarse) {
      .cursor {
        display: none !important;
      }
      .cursor__inner {
        display: none !important;
      }
    }
    @media (max-width: 900px) {
      .cursor {
        display: none !important;
      }
      .cursor__inner {
        display: none !important;
      }

      * {
        cursor: auto;
      }

    }

    .card {
      width: 500px;
      height: 500px;
      top: 300px;
      left: 300px;
      background-color: darkslategrey;
      overflow: hidden;
      position: absolute;
    }

    img {
      width: 100vw;
    }
  </style>
</head>
