<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>title</title>
    <style>
body {
  background-color: black;
}
* {
        cursor:none;
}

.cursor {
  z-index: 100;
  border: 1px solid #ffffff30;
  border-radius: 50%;
  width: 3em;
  height: 3em;
  transition: background-color .375s cubic-bezier(.625, .05, 0, 1), height .375s cubic-bezier(.625, .05, 0, 1), width .375s cubic-bezier(.625, .05, 0, 1), opacity .5s linear;
  position: fixed;
  inset: 0% auto auto 0%;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cursor, .cursor__dot, .cursor__anim {
    mix-blend-mode: difference;
}

.cursor__inner {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    width: 10px;
    height: 10px;
    inset: 0% auto auto 0%;
}

.cursor__dot {
    width: 7px;
    height: 7px;
    margin-left: 1px;
    margin-top: 1px;
    border: 1px solid #ffffff;
    border-radius: 50%;
    transition: opacity .3s linear;
    position: absolute;
    opacity: 1;
}

.cursor__anim {
    width: 9px;
    height: 9px;
    opacity: 0;
    position: absolute;
    margin-left: 1px;
    margin-top: 1px;
    transition: opacity .3s linear;
}

.cursor__glow--blue {
  width: 160px;
  height: 160px;
  margin-left: -75px;
  margin-top: -75px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(91, 126, 207, 0.70) 0%, rgba(91, 126, 207, 0.00) 100%);
  border-radius: 50%;
  position: absolute;
  opacity: 0;
  transition: opacity .5s linear;
}

.cursor__glow--pink {
  width: 160px;
  height: 160px;
  margin-left: -75px;
  margin-top: -75px;
  background: radial-gradient(50% 50% at 50% 50%, #EAAEAE 0%, rgba(234, 174, 174, 0.00) 100%);
  border-radius: 50%;
  position: absolute;
  opacity: 0;
  transition: opacity .5s linear;
}

.cursor__inner.cursor__inner--moving .cursor__anim {
  opacity: 1;
}
.cursor__inner.cursor__inner--moving .cursor__dot {
  opacity: 0;
}

body:has( a:hover) .cursor,
body:has( button:hover) .cursor,
body:has( [data-cursor]:hover) .cursor{
  width: 1.25em;
  height: 1.25em;
  border-color: #EAAEAE50;
}
body:has( a:hover) .cursor__dot,
body:has( button:hover) .cursor__dot,
body:has( [data-cursor]:hover) .cursor__dot{
    background-color: #EAAEAE;
    border: 0px solid #ffffff00;
    margin: 0;
    width: 10px;
    height: 10px;
    opacity: 1 !important;
}

body:has( a:hover) .cursor__anim,
body:has( button:hover) .cursor__anim,
body:has( [data-cursor]:hover) .cursor__anim {
    opacity: 0 !important;
}

body:has( .glow--pink:hover) .cursor, body:has( .glow--blue:hover) .cursor {
    opacity: 0;
}


body:has( .glow--blue:hover) .cursor__glow--blue, body:has( .glow--pink:hover) .cursor__glow--pink {
    opacity: 0.6;
}

body:has( .glow--pink:hover) .cursor__dot, body:has( .glow--pink:hover) .cursor__anim, 
body:has( .glow--blue:hover) .cursor__dot, body:has( .glow--blue:hover) .cursor__anim {
  mix-blend-mode: normal;
}


@media (hover: none) and (pointer: coarse) {
  .cursor {
    display: none;
  }
}

.card {
  width: 500px;
  height: 500px;
  position: fixed;
  top: 100px;
  left: 100px;
  background-color: darkslategrey;
}

    </style>
    <script>
        let cursorTimeOut;
        window.addEventListener("mousemove", e => {
            if(cursorTimeOut) clearTimeout(cursorTimeOut)
            cursorTimeOut = setTimeout(() => {
                document.querySelector('.cursor__inner').classList.remove('cursor__inner--moving')
            }, 100)
            if(document.querySelector('.cursor__inner--moving')) return;
            else document.querySelector('.cursor__inner').classList.add('cursor__inner--moving')
        });
    </script>
</head>

<body>
 <!-- <img src="/homepage.png" /> -->
 <div class="card glow--pink">
   This is a test
   <button>HELLOOOOO</button>
  </div>
  <div class="glow"></div>
   <div class="cursor"></div>
    <div class="cursor__inner">
        <div class="cursor__dot"></div>
        <div class="cursor__glow--blue"></div>
        <div class="cursor__glow--pink"></div>
        <img class="cursor__anim" src="/cursor.gif" />
    </div>
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./osmoCursor.js"></script>
</body>

</html>
