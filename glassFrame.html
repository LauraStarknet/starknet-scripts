        html,
        body,
        canvas {
            width: 100%;
            height: 100%;
            background-color: black;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            padding: 10px;
            background: #ffffff20;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            /* border-radius: 50px; */
            overflow: visible;
            /* linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0); */
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: xor;
            pointer-events: none;
            z-index: 1;
        }
